apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-debian-vm-l2bridge
automountServiceAccountToken: false
---
apiVersion: launchlayer.nvidia.com/v1alpha1
kind: VirtualInstance
metadata:
  name: e2e-debian-vm-l2bridge
  annotations:
    launchlayer.nvidia.com/org-id: tenant-2
    launchlayer.nvidia.com/role: trainer
spec:
  instance_id: e2e-debian-vm-l2bridge
  node_name: k2-worker
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: e2e-debian-vm-l2bridge
  labels:
    app: e2e-vm
    kubevirt.io/vm: e2e-debian-vm-l2bridge
    tenant: tenant1
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: e2e-debian-vm-l2bridge
        app: e2e-vm
        tenant: tenant1
        spiffe.nvidia.com/service: dsx
      annotations:
        spiffe.nvidia.com/inject-dsx-imds: 'true'
        hooks.kubevirt.io/hookSidecars: '[{"args": ["--version", "v1alpha2"], "configMap":
          {"name": "e2e-l2bridge-cloud-init", "key": "preCloudInitIso", "hookPath":
          "/usr/bin/preCloudInitIso"}}]'
    spec:
      nodeSelector:
        kubernetes.io/hostname: k2-worker
      domain:
        cpu:
          cores: 1
        devices:
          # Match the Alpine RNG and headless defaults in KubeVirt E2E tests.
          # https://github.com/kubevirt/kubevirt/blob/v1.9.0/tests/libvmifact/factory.go#L87-L95
          # https://github.com/kubevirt/kubevirt/blob/v1.9.0/tests/testsuite/fixture.go#L179-L182
          rng: {}
          autoattachGraphicsDevice: false
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinit
            - disk:
                bus: virtio
                readonly: true
              name: vm-service-account
          interfaces:
            - name: default
              # managedTap supplies Ethernet only. The cloud-init hook configures the guest IP.
              binding:
                name: l2bridge
        features:
          acpi:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 160Mi
          limits:
            cpu: "1"
            # Replace the 32 MiB graphics allowance KubeVirt omits for headless VMs.
            # Reserve 20 MiB of extra QEMU headroom for this fixture.
            # Follow the upstream estimate increase in kubevirt/kubevirt#18388.
            memory: 212Mi
      networks:
        - name: default
          multus:
            # Multus default-network references require an explicit namespace.
            networkName: tenant-tenant1/tenant-tenant1-network
            default: true
      volumes:
        - containerDisk:
            image: quay.io/kubevirt/alpine-with-test-tooling-container-disk:v1.9.0@sha256:a6f3d9ffffa7d1e4cd19aa80aae21abfc09dd289db854b4098c7ed2e14e21b55
            imagePullPolicy: IfNotPresent
          name: rootdisk
        - cloudInitNoCloud:
            secretRef:
              name: e2e-debian-vm-cloud-init
          name: cloudinit
        - name: vm-service-account
          serviceAccount:
            serviceAccountName: e2e-debian-vm-l2bridge
